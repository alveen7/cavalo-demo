<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>CAVALO — Calibration, Validation & Verification System</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --color-background-primary:#ffffff;
  --color-background-secondary:#f5f5f3;
  --color-background-tertiary:#efefec;
  --color-background-info:#e6f1fb;
  --color-background-warning:#faeeda;
  --color-background-danger:#fcebeb;
  --color-background-success:#eaf3de;
  --color-text-primary:#1a1a1a;
  --color-text-secondary:#6b6b6b;
  --color-border-tertiary:rgba(0,0,0,0.08);
  --color-border-secondary:rgba(0,0,0,0.14);
  --color-border-primary:rgba(0,0,0,0.22);
  --color-border-info:rgba(24,95,165,0.3);
  --color-border-warning:rgba(186,117,23,0.3);
  --color-border-danger:rgba(162,45,45,0.3);
  --color-text-info:#0c447c;
  --color-text-warning:#854f0b;
  --color-text-danger:#a32d2d;
  --color-text-success:#3b6d11;
  --border-radius-md:8px;
  --border-radius-lg:12px;
  --font-sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --font-mono:'SF Mono','Fira Code',monospace;
}
@media(prefers-color-scheme:dark){
  :root{
    --color-background-primary:#1e1e1e;
    --color-background-secondary:#2a2a2a;
    --color-background-tertiary:#141414;
    --color-background-info:#0c2440;
    --color-background-warning:#3d2800;
    --color-background-danger:#3d1010;
    --color-background-success:#0d2e07;
    --color-text-primary:#e8e8e8;
    --color-text-secondary:#999;
    --color-border-tertiary:rgba(255,255,255,0.08);
    --color-border-secondary:rgba(255,255,255,0.14);
    --color-border-primary:rgba(255,255,255,0.22);
    --color-border-info:rgba(56,138,221,0.35);
    --color-border-warning:rgba(239,159,39,0.35);
    --color-border-danger:rgba(226,75,74,0.35);
    --color-text-info:#60a8e8;
    --color-text-warning:#e8a84a;
    --color-text-danger:#e87070;
    --color-text-success:#7dc455;
  }
}
body{font-family:var(--font-sans);font-size:13px;color:var(--color-text-primary);background:var(--color-background-tertiary);min-height:100vh}
/* --- LOGIN --- */
.lw{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;background:var(--color-background-tertiary)}
.ll{font-size:36px;font-weight:700;color:#0f1e35;letter-spacing:0.5px;margin-bottom:4px}
.lt{font-size:13px;color:var(--color-text-secondary);margin-bottom:8px;text-align:center}
.lco{font-size:12px;font-weight:500;color:#185fa5;margin-bottom:28px;padding:5px 14px;border-radius:20px;background:#e6f1fb;border:0.5px solid #b5d4f4;display:inline-block}
.ag{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:24px;width:100%;max-width:860px}
@media(max-width:700px){.ag{grid-template-columns:1fr 1fr}}
.ac{border:1.5px solid var(--color-border-secondary);border-radius:var(--border-radius-lg);padding:14px 10px;cursor:pointer;background:var(--color-background-primary);text-align:center;transition:all 0.15s}
.ac:hover{border-color:#185fa5;transform:translateY(-2px);box-shadow:0 4px 16px rgba(24,95,165,0.12)}
.ac.sel{border-color:#185fa5;background:#e6f1fb}
.aav{width:42px;height:42px;border-radius:50%;margin:0 auto 10px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff}
.an{font-size:11px;font-weight:600;margin-bottom:2px;line-height:1.3}
.ar{font-size:10px;color:var(--color-text-secondary);margin-bottom:7px;line-height:1.3}
.acred{font-family:var(--font-mono);font-size:9px;color:var(--color-text-secondary);background:var(--color-background-secondary);padding:3px 7px;border-radius:4px;display:inline-block}
.lb{padding:11px 40px;border-radius:var(--border-radius-lg);font-size:14px;cursor:pointer;border:none;background:#185fa5;color:#fff;font-family:var(--font-sans);font-weight:600;transition:background 0.15s}
.lb:hover{background:#0c447c}
/* --- APP SHELL --- */
.app{display:flex;height:100vh;background:var(--color-background-primary)}
.sb{width:200px;flex-shrink:0;background:#0f1e35;display:flex;flex-direction:column;overflow-y:auto}
.sb-logo{padding:14px 15px 11px;border-bottom:1px solid rgba(255,255,255,0.07)}
.sb-logo-t{font-size:15px;font-weight:700;color:#fff;letter-spacing:0.5px}
.sb-logo-s{font-size:9px;color:rgba(255,255,255,0.28);margin-top:1px;text-transform:uppercase;letter-spacing:0.7px}
.sb-sec{padding:11px 15px 4px;font-size:9px;color:rgba(255,255,255,0.22);letter-spacing:1px;text-transform:uppercase}
.ni{display:flex;align-items:center;gap:8px;padding:8px 13px;cursor:pointer;color:rgba(255,255,255,0.48);font-size:11px;border-left:2px solid transparent;transition:all 0.12s;user-select:none}
.ni:hover{background:rgba(255,255,255,0.05);color:rgba(255,255,255,0.85)}
.ni.active{background:rgba(56,170,255,0.12);border-left-color:#38aaff;color:#38aaff;font-weight:600}
.ni-ico{width:14px;height:14px;flex-shrink:0;opacity:0.7}
.ni.active .ni-ico{opacity:1}
.nb{background:#e24b4a;color:#fff;font-size:9px;padding:1px 5px;border-radius:10px;margin-left:auto;font-weight:700;flex-shrink:0}
.sb-bot{margin-top:auto;padding:11px 13px;border-top:1px solid rgba(255,255,255,0.07);display:flex;align-items:center;gap:9px;cursor:pointer;flex-shrink:0}
.sb-bot:hover{background:rgba(255,255,255,0.04)}
.uav{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;flex-shrink:0}
/* --- MAIN --- */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{padding:11px 20px;border-bottom:0.5px solid var(--color-border-tertiary);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;background:var(--color-background-primary)}
.tb-t{font-size:15px;font-weight:600}
.tb-m{font-size:10px;color:var(--color-text-secondary);margin-top:1px;font-family:var(--font-mono)}
.tb-r{display:flex;align-items:center;gap:9px}
.rchip{font-size:10px;padding:3px 10px;border-radius:20px;font-weight:500}
.nbtn{width:32px;height:32px;border-radius:var(--border-radius-md);border:0.5px solid var(--color-border-secondary);background:var(--color-background-primary);cursor:pointer;display:flex;align-items:center;justify-content:center;position:relative}
.nbtn:hover{background:var(--color-background-secondary)}
.ndot{position:absolute;top:4px;right:4px;width:7px;height:7px;border-radius:50%;background:#e24b4a;border:1.5px solid var(--color-background-primary);display:none}
.npanel{display:none;position:fixed;top:56px;right:16px;width:300px;background:var(--color-background-primary);border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-lg);z-index:999;box-shadow:0 8px 24px rgba(0,0,0,0.14)}
.npanel.open{display:block}
.np-hdr{padding:10px 13px;border-bottom:0.5px solid var(--color-border-tertiary);display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:600}
.ne{padding:10px 13px;border-bottom:0.5px solid var(--color-border-tertiary);display:flex;gap:9px;cursor:pointer;transition:background 0.1s}
.ne:hover{background:var(--color-background-secondary)}
.ne:last-child{border-bottom:none}
.ne-txt{font-size:11px;line-height:1.4;flex:1}
.ne-time{font-size:9px;color:var(--color-text-secondary);margin-top:2px}
.ne-dot{width:7px;height:7px;border-radius:50%;background:#185fa5;flex-shrink:0;margin-top:4px}
.btn{padding:6px 12px;border-radius:var(--border-radius-md);font-size:11px;cursor:pointer;border:0.5px solid var(--color-border-secondary);background:var(--color-background-primary);color:var(--color-text-primary);font-family:var(--font-sans);transition:background 0.12s}
.btn:hover{background:var(--color-background-secondary)}
.btn-p{background:#185fa5;border-color:#185fa5;color:#fff}
.btn-p:hover{background:#0c447c}
.btn-s{background:var(--color-background-success);border-color:#c0dd97;color:var(--color-text-success)}
.btn-d{background:var(--color-background-danger);border-color:#f09595;color:var(--color-text-danger)}
.content{flex:1;overflow-y:auto}
/* --- FILTER BAR --- */
.fbar{display:flex;align-items:center;gap:9px;padding:8px 16px;background:var(--color-background-secondary);border-bottom:0.5px solid var(--color-border-tertiary);flex-wrap:wrap;flex-shrink:0}
.fbg{display:flex;border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);overflow:hidden}
.fbb{padding:4px 11px;font-size:10px;cursor:pointer;border:none;background:var(--color-background-primary);color:var(--color-text-secondary);font-family:var(--font-sans);border-right:0.5px solid var(--color-border-secondary)}
.fbb:last-child{border-right:none}
.fbb:hover{background:var(--color-background-secondary)}
.fbb.active{background:#185fa5;color:#fff}
.fab{padding:4px 9px;border-radius:var(--border-radius-md);font-size:10px;border:0.5px solid var(--color-border-secondary);background:var(--color-background-primary);color:var(--color-text-primary);cursor:pointer;font-family:var(--font-sans)}
/* --- DASHBOARD COMPONENTS --- */
.db-body{padding:14px 16px}
.krow{display:flex;gap:9px;margin-bottom:11px;flex-wrap:nowrap;overflow-x:auto}
.kcard{flex:1;min-width:110px;background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:9px 11px;border-bottom:3px solid var(--color-border-secondary)}
.kcard.good{border-bottom-color:#639922}.kcard.warn{border-bottom-color:#ef9f27}.kcard.danger{border-bottom-color:#e24b4a}.kcard.info{border-bottom-color:#185fa5}.kcard.purple{border-bottom-color:#534ab7}.kcard.teal{border-bottom-color:#0f6e56}.kcard.neutral{border-bottom-color:#888780}
.kl{font-size:8px;text-transform:uppercase;letter-spacing:0.4px;color:var(--color-text-secondary);line-height:1.3;margin-bottom:1px}
.kf{font-size:7px;color:var(--color-text-secondary);font-style:italic;margin-bottom:3px;line-height:1.3;opacity:0.85}
.kv{font-size:20px;font-weight:600;line-height:1;margin-bottom:3px}
.kd{font-size:9px;line-height:1.3}
.kd.up{color:var(--color-text-success)}.kd.dn{color:var(--color-text-danger)}.kd.neu{color:var(--color-text-secondary)}
.crow{display:grid;gap:11px;margin-bottom:11px}
.c2{grid-template-columns:3fr 2fr}.c22{grid-template-columns:1fr 1fr}
@media(max-width:900px){.c2,.c22{grid-template-columns:1fr}}
.cc{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);padding:11px 13px;overflow:hidden}
.ch{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:7px}
.ct{font-size:11px;font-weight:600;line-height:1.3}
.cs{font-size:8px;color:var(--color-text-secondary);margin-top:1px;font-style:italic}
.cwrap{position:relative}
.dc{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none}
.dc-n{font-size:17px;font-weight:600;line-height:1}
.dc-l{font-size:8px;color:var(--color-text-secondary);margin-top:1px}
.shlbl{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:0.7px;color:var(--color-text-secondary);margin:11px 0 7px;padding-bottom:4px;border-bottom:0.5px solid var(--color-border-tertiary)}
/* --- BADGES --- */
.badge{display:inline-flex;padding:2px 7px;border-radius:20px;font-size:9px;font-weight:600;white-space:nowrap}
.b-ok{background:var(--color-background-success);color:var(--color-text-success)}
.b-exp{background:var(--color-background-danger);color:var(--color-text-danger)}
.b-due{background:var(--color-background-warning);color:var(--color-text-warning)}
.b-cal{background:var(--color-background-info);color:var(--color-text-info)}
.b-val{background:#eeedfe;color:#3c3489}
.b-gry{background:var(--color-background-secondary);color:var(--color-text-secondary);border:0.5px solid var(--color-border-secondary)}
.b-teal{background:#e1f5ee;color:#085041}
/* --- TABLES --- */
.mono{font-family:var(--font-mono);font-size:10px}
.mt{width:100%;border-collapse:collapse;font-size:11px}
.mt th{font-size:9px;font-weight:600;color:var(--color-text-secondary);text-align:left;padding:5px 7px;border-bottom:0.5px solid var(--color-border-tertiary);background:var(--color-background-secondary);white-space:nowrap}
.mt td{padding:7px;border-bottom:0.5px solid var(--color-border-tertiary);vertical-align:middle}
.mt tr:last-child td{border-bottom:none}
.mt tr:hover td{background:var(--color-background-secondary)}
/* --- ALERTS --- */
.alert{padding:7px 11px;border-radius:var(--border-radius-md);font-size:11px;line-height:1.5;margin-bottom:9px;display:flex;gap:8px;align-items:flex-start}
.aw{background:var(--color-background-warning);border:0.5px solid var(--color-border-warning);color:var(--color-text-warning)}
.ai{background:var(--color-background-info);border:0.5px solid var(--color-border-info);color:var(--color-text-info)}
.ad{background:var(--color-background-danger);border:0.5px solid var(--color-border-danger);color:var(--color-text-danger)}
/* --- FORMS --- */
.pg{padding:14px 16px}
.card{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);padding:13px 15px;margin-bottom:11px}
.card-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}
.card-t{font-size:12px;font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
@media(max-width:700px){.grid2,.grid3{grid-template-columns:1fr}}
.fg{display:flex;flex-direction:column;gap:4px}
.fg.full{grid-column:1/-1}
.fl{font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;color:var(--color-text-secondary)}
.req{color:#e24b4a}
.fi{padding:7px 9px;border-radius:var(--border-radius-md);font-size:12px;border:0.5px solid var(--color-border-secondary);background:var(--color-background-primary);color:var(--color-text-primary);font-family:var(--font-sans);width:100%}
.fi:focus{outline:none;border-color:#185fa5}
.fi.auto{background:var(--color-background-secondary);color:var(--color-text-secondary)}
.fsel{padding:7px 9px;border-radius:var(--border-radius-md);font-size:12px;border:0.5px solid var(--color-border-secondary);background:var(--color-background-primary);color:var(--color-text-primary);font-family:var(--font-sans);width:100%;cursor:pointer}
.ftxt{padding:7px 9px;border-radius:var(--border-radius-md);font-size:12px;border:0.5px solid var(--color-border-secondary);background:var(--color-background-primary);color:var(--color-text-primary);font-family:var(--font-sans);width:100%;min-height:54px;resize:vertical}
.ftxt:focus{outline:none;border-color:#185fa5}
.auto-chip{font-size:8px;padding:1px 6px;border-radius:10px;background:#e6f1fb;color:#0c447c;margin-left:4px;vertical-align:middle}
/* --- APPROVAL --- */
.aq-item{border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);padding:11px 13px;margin-bottom:9px;transition:border-color 0.12s}
.aq-item:hover{border-color:var(--color-border-secondary)}
/* --- MISC --- */
.actrow{display:flex;gap:9px;padding:7px 0;border-bottom:0.5px solid var(--color-border-tertiary);font-size:11px;align-items:flex-start}
.actrow:last-child{border-bottom:none}
.at{font-family:var(--font-mono);font-size:9px;color:var(--color-text-secondary);min-width:40px;padding-top:1px}
.adot{width:7px;height:7px;border-radius:50%;flex-shrink:0;margin-top:3px}
.atxt{flex:1;line-height:1.4}
.pip-step{font-size:9px;padding:2px 7px;border-radius:20px;border:0.5px solid var(--color-border-tertiary);color:var(--color-text-secondary);white-space:nowrap}
.pip-step.done{background:var(--color-background-success);border-color:#c0dd97;color:var(--color-text-success)}
.pip-step.curr{background:var(--color-background-info);border-color:#b5d4f4;color:var(--color-text-info);font-weight:600}
.pip-arr{font-size:9px;color:var(--color-text-secondary)}
.cskel{display:flex;align-items:center;justify-content:center;background:var(--color-background-secondary);border-radius:4px;color:var(--color-text-secondary);font-size:10px}
</style>
</head>
<body>

<!-- NOTIFICATION PANEL -->
<div class="npanel" id="np">
  <div class="np-hdr">Notifications <button onclick="document.getElementById('np').classList.remove('open')" style="background:none;border:none;font-size:14px;cursor:pointer;color:var(--color-text-secondary)">✕</button></div>
  <div id="np-list"></div>
</div>

<!-- LOGIN -->
<div id="ls">
<div class="lw">
  <div class="ll">CAVALO</div>
  <div class="lt">Calibration, Validation &amp; Verification Management System</div>
  <div class="lco">PT. Amerta Indah Otsuka</div>
  <div class="ag" id="ag"></div>
  <button class="lb" onclick="doLogin()">Sign In →</button>
  <p id="lhint" style="margin-top:12px;font-size:11px;color:var(--color-text-secondary);text-align:center">Select one of the 5 role-based accounts above</p>
</div>
</div>

<!-- APP -->
<div id="as" style="display:none">
<div class="app">
  <div class="sb" id="sb-el">
    <div class="sb-logo"><div class="sb-logo-t">CAVALO</div><div class="sb-logo-s">PT. Amerta Indah Otsuka</div></div>
    <div id="sb-nav"></div>
    <div class="sb-bot" onclick="logout()">
      <div class="uav" id="sb-av"></div>
      <div><div style="font-size:11px;color:rgba(255,255,255,0.65)" id="sb-nm"></div><div style="font-size:9px;color:rgba(255,255,255,0.3)" id="sb-rl"></div></div>
    </div>
  </div>
  <div class="main">
    <div class="topbar">
      <div><div class="tb-t" id="tb-t">Dashboard</div><div class="tb-m" id="tb-m"></div></div>
      <div class="tb-r">
        <span class="rchip" id="rchip"></span>
        <div style="position:relative">
          <div class="nbtn" onclick="toggleN()">
            <svg width="15" height="15" viewBox="0 0 16 16" fill="none"><path d="M8 1a5 5 0 015 5v3l1.5 2H1.5L3 9V6a5 5 0 015-5z" stroke="currentColor" stroke-width="1.2"/><path d="M6.5 13a1.5 1.5 0 003 0" stroke="currentColor" stroke-width="1.2"/></svg>
          </div>
          <div class="ndot" id="ndot"></div>
        </div>
        <button class="btn btn-p" id="cta-btn" onclick="ctaAct()"></button>
      </div>
    </div>
    <div class="content" id="mc"></div>
  </div>
</div>
</div>

<script>
// ── DATA ──
var D={
  month:{lb:['Oct','Nov','Dec','Jan','Feb','Mar'],
    vP:[12,10,8,15,13,14],vA:[10,9,7,12,11,9],

    tat:[3.0,2.9,2.8,2.5],ot:[80,83,87,89],ce:[5.5,4.8,4.1,3.5],
    fp:[80,83,83,90],kf:[80,82,84,86],kg:[88,90,92,93],ke:[80,83,87,90],

  year:{lb:['2022','2023','2024','2025','2026 YTD'],
